<!doctype html>
<!-- @dsCard group="Components" name="Cards" subtitle="Default + small card surfaces" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cards</title>
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="card-frame">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
  <div style="background:#fff;border:1px solid #E0E0E0;border-radius:12px;padding:18px 20px;box-shadow:0 1px 2px rgba(0,0,0,0.06)">
    <div style="font-size:14px;font-weight:600;color:#141414">Default card · radius-xl</div>
    <div style="font-size:11px;color:#777;margin-top:4px;font-family:'DM Mono',monospace">padding 20/24 · shadow-sm</div>
  </div>
  <div style="background:#fff;border:1px solid #E0E0E0;border-radius:8px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,0.06)">
    <div style="font-size:13px;font-weight:600;color:#141414">Small card · radius-lg</div>
    <div style="font-size:11px;color:#777;margin-top:4px;font-family:'DM Mono',monospace">padding 16 · shadow-sm</div>
  </div>
</div>
<p style="font-size:11px;color:#777;margin:18px 0 0">No hover lift. No coloured borders. Borders are 1px neutral-200; shadow is warm-grey only.</p>
</div>
</body>
</html>
