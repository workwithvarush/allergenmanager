<!doctype html>
<!-- @dsCard group="Colors" name="Semantic colours" subtitle="Danger · warning · success · info — fg/bg pairs" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Semantic colours</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card-frame">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">

<div style="display:flex;flex-direction:column;gap:6px">
  <div style="display:flex;gap:4px">
    <div style="background:#C0392B;height:48px;flex:1;border-radius:6px"></div>
    <div style="background:#FDECEA;height:48px;flex:1;border-radius:6px;border:1px solid #E0E0E0"></div>
  </div>
  <div>
    <div style="font-size:11px;font-weight:600;color:#252525">Danger</div>
    <div style="font-size:10px;color:#777;font-family:'DM Mono',monospace">#C0392B · #FDECEA</div>
  </div>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
  <div style="display:flex;gap:4px">
    <div style="background:#B7791A;height:48px;flex:1;border-radius:6px"></div>
    <div style="background:#FEF6E7;height:48px;flex:1;border-radius:6px;border:1px solid #E0E0E0"></div>
  </div>
  <div>
    <div style="font-size:11px;font-weight:600;color:#252525">Warning</div>
    <div style="font-size:10px;color:#777;font-family:'DM Mono',monospace">#B7791A · #FEF6E7</div>
  </div>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
  <div style="display:flex;gap:4px">
    <div style="background:#2D7D46;height:48px;flex:1;border-radius:6px"></div>
    <div style="background:#EAF5EE;height:48px;flex:1;border-radius:6px;border:1px solid #E0E0E0"></div>
  </div>
  <div>
    <div style="font-size:11px;font-weight:600;color:#252525">Success</div>
    <div style="font-size:10px;color:#777;font-family:'DM Mono',monospace">#2D7D46 · #EAF5EE</div>
  </div>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
  <div style="display:flex;gap:4px">
    <div style="background:#1A5CA8;height:48px;flex:1;border-radius:6px"></div>
    <div style="background:#E8F0FB;height:48px;flex:1;border-radius:6px;border:1px solid #E0E0E0"></div>
  </div>
  <div>
    <div style="font-size:11px;font-weight:600;color:#252525">Info</div>
    <div style="font-size:10px;color:#777;font-family:'DM Mono',monospace">#1A5CA8 · #E8F0FB</div>
  </div>
</div>
</div>
<p style="font-size:11px;color:#777;margin:14px 0 0">Each state has fg / bg pair (+ 1px tinted border on banners).</p>
</div>
</body>
</html>
