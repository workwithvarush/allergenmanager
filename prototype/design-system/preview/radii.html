<!doctype html>
<!-- @dsCard group="Spacing" name="Border radius" subtitle="sm · md · lg · xl · pill" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Border radius</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card-frame">
<div style="display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap">

<div style="text-align:center">
  <div style="width:48px;height:48px;background:#EAF2EE;border:1px solid #3B6B54;border-radius:4px;margin:0 auto 6px"></div>
  <div style="font-size:10px;font-family:'DM Mono',monospace;color:#555">--radius-sm</div>
  <div style="font-size:9px;color:#999">Allergen cells, tags</div>
</div>
<div style="text-align:center">
  <div style="width:60px;height:48px;background:#EAF2EE;border:1px solid #3B6B54;border-radius:6px;margin:0 auto 6px"></div>
  <div style="font-size:10px;font-family:'DM Mono',monospace;color:#555">--radius-md</div>
  <div style="font-size:9px;color:#999">Buttons, inputs</div>
</div>
<div style="text-align:center">
  <div style="width:72px;height:48px;background:#EAF2EE;border:1px solid #3B6B54;border-radius:8px;margin:0 auto 6px"></div>
  <div style="font-size:10px;font-family:'DM Mono',monospace;color:#555">--radius-lg</div>
  <div style="font-size:9px;color:#999">Small cards, doc rows</div>
</div>
<div style="text-align:center">
  <div style="width:88px;height:56px;background:#EAF2EE;border:1px solid #3B6B54;border-radius:12px;margin:0 auto 6px"></div>
  <div style="font-size:10px;font-family:'DM Mono',monospace;color:#555">--radius-xl</div>
  <div style="font-size:9px;color:#999">Cards, panels, shell</div>
</div>
<div style="text-align:center">
  <div style="width:80px;height:32px;background:#EAF2EE;border:1px solid #3B6B54;border-radius:999px;margin:0 auto 6px"></div>
  <div style="font-size:10px;font-family:'DM Mono',monospace;color:#555">--radius-pill</div>
  <div style="font-size:9px;color:#999">Tag toggles, pills</div>
</div>
</div>
</div>
</body>
</html>
