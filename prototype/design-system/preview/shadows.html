<!doctype html>
<!-- @dsCard group="Spacing" name="Elevation · shadows" subtitle="sm cards · md popovers · lg modals" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elevation</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card-frame">
<div style="display:flex;gap:20px;align-items:flex-end;padding:8px 4px">

<div style="text-align:center">
  <div style="width:96px;height:64px;background:#fff;border:1px solid #E0E0E0;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,0.06);margin:0 auto 8px"></div>
  <div style="font-size:10px;font-family:'DM Mono',monospace;color:#555">--shadow-sm</div>
  <div style="font-size:9px;color:#999;margin-top:2px">Cards default</div>
</div>
<div style="text-align:center">
  <div style="width:96px;height:64px;background:#fff;border:1px solid #E0E0E0;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.08);margin:0 auto 8px"></div>
  <div style="font-size:10px;font-family:'DM Mono',monospace;color:#555">--shadow-md</div>
  <div style="font-size:9px;color:#999;margin-top:2px">Dropdowns, popovers</div>
</div>
<div style="text-align:center">
  <div style="width:96px;height:64px;background:#fff;border:1px solid #E0E0E0;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.10);margin:0 auto 8px"></div>
  <div style="font-size:10px;font-family:'DM Mono',monospace;color:#555">--shadow-lg</div>
  <div style="font-size:9px;color:#999;margin-top:2px">Modals</div>
</div>
</div>
<p style="font-size:11px;color:#777;margin:18px 0 0">Warm-grey only. No coloured glows. No inner shadows. No glassmorphism.</p>
</div>
</body>
</html>
